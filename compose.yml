services:
  postgres:
    image: postgres:17-alpine
    container_name: prestamos-facil-postgres
    environment:
      POSTGRES_DB: prestamos_facil
      POSTGRES_USER: prestamos
      POSTGRES_PASSWORD: prestamos
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prestamos -d prestamos_facil"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

