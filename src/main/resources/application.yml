spring:
  application:
    name: prestamos-facil-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/prestamos_facil}
    username: ${DB_USERNAME:prestamos}
    password: ${DB_PASSWORD:prestamos}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${SERVER_PORT:8080}

